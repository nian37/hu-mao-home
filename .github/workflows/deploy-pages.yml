name: Deploy dynamic site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'worker.js'
      - 'functions/**'
      - 'wrangler.pages.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy dynamic site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --config=wrangler.pages.toml
          workingDirectory: .